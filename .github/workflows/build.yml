name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Build
        run: |
          xcodebuild build \
            -project Redline.xcodeproj \
            -scheme Redline \
            -configuration Release \
            -derivedDataPath build
